# 压测配置：4 台本地假上游 + 动态负载均衡
port=15353
cache-size=2000
no-resolv
no-poll

# 4 台本地假上游（由 stress.py 启动）
server=127.0.0.1#15361
server=127.0.0.1#15362
server=127.0.0.1#15363
server=127.0.0.1#15364

# 动态负载均衡：按 (在途数+1) × EWMA(RTT) 选上游
balance=dynamic

# 熔断冷却基数调小一点，便于在压测的几秒内观察到熔断与恢复
server-cooldown=500

# 打开查询日志（压测脚本会从日志里抓统计）
log-queries
